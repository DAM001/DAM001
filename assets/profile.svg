<svg xmlns="http://www.w3.org/2000/svg" width="840" height="629" viewBox="0 0 840 629" role="img" aria-label="Dávid Attila Marcell — full-stack developer bridging web and hardware. Tech stack — Web: HTML &amp; CSS, JavaScript, TypeScript, Node.js, Pixi.js, Three.js; Hardware: ESP32, JavaScript, C++, Arduino, Web Serial / BLE, 3D printing; Games: Unity, C#, Photon, Blender, Python">
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }

  .name { font-size: 38px; font-weight: 900; fill: #e2ddd0; }
  .body { font-size: 16.5px; fill: #b8b2a6; }
  .hl { fill: #5090c8; font-weight: 700; }
  .cart { animation: ride 6s cubic-bezier(.45,0,.25,1) infinite; }
