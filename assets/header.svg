<text x="84" y="168.3" class="body"><tspan class="">Hey, </tspan><tspan class="">I&#x27;m </tspan><tspan class="hl">Marci</tspan><tspan class="">, </tspan><tspan class="">a </tspan><tspan class="hl">full-stack </tspan></text><text x="84" y="227.2" class="body"><tspan class="hl">developer</tspan><tspan class=""> </tspan><tspan class="">bridging </tspan><tspan class="hl">web</tspan><tspan class=""> </tspan><tspan class="">and </tspan></text><text x="84" y="286.1" class="body"><tspan class="hl">hardware</tspan><tspan class="">. </tspan><tspan class="">Research </tspan><tspan class="">developer </tspan><tspan class="">at </tspan></text><text x="84" y="345.0" class="body"><tspan class="hl">Bay </tspan><tspan class="hl">Zoltán </tspan><tspan class="hl">Research </tspan><tspan class="hl">Institute</tspan><tspan class="">. </tspan><tspan class="">I </tspan></text><text x="84" y="403.9" class="body"><tspan class="">build </tspan><tspan class="">web </tspan><tspan class="">apps </tspan><tspan class="">and </tspan><tspan class="">games, </tspan><tspan class="">teach </tspan></text><text x="84" y="462.8" class="body"><tspan class="">programming, </tspan><tspan class="">and </tspan><tspan class="">tinker </tspan><tspan class="">with </tspan></text><text x="84" y="521.7" class="body"><tspan class="">microchips.</tspan></text>
